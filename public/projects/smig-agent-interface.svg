<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">SMIG Agente Conversacional de Voz</title>
  <desc id="desc">Interfaz conceptual del agente de voz con memoria documental y conexiones historicas.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff7fa"/>
      <stop offset="0.52" stop-color="#f7f1f5"/>
      <stop offset="1" stop-color="#eceef7"/>
    </linearGradient>
    <linearGradient id="wine" x1="0" x2="1">
      <stop offset="0" stop-color="#7f1134"/>
      <stop offset="1" stop-color="#b01852"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#5b0c2a" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1200" height="800" rx="34" fill="url(#bg)"/>
  <circle cx="1000" cy="120" r="210" fill="#ffd9e7" opacity="0.4"/>
  <circle cx="160" cy="690" r="220" fill="#e0e7ff" opacity="0.55"/>

  <g transform="translate(54 46)">
    <rect width="1092" height="708" rx="28" fill="#fff" filter="url(#shadow)"/>
    <rect width="1092" height="74" rx="28" fill="#fff"/>
    <path d="M0 74h1092" stroke="#eee5ea"/>
    <g transform="translate(30 20)">
      <rect width="34" height="34" rx="9" fill="url(#wine)"/>
      <path d="M18 9v16M10 17h16" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
      <text x="50" y="16" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="800" fill="#3d1324">SMIG Voice Agent</text>
      <text x="50" y="36" font-family="Inter, Arial, sans-serif" font-size="12" fill="#8b6675">Sistema de Informacion Geografica de Tijuana</text>
    </g>
    <g transform="translate(862 22)">
      <rect width="88" height="30" rx="15" fill="#f5e7ed"/>
      <text x="44" y="20" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#8c143b">1996-2026</text>
      <rect x="102" width="98" height="30" rx="15" fill="#ecfff5"/>
      <circle cx="120" cy="15" r="4" fill="#00a76f"/>
      <text x="158" y="20" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#066342">LIVE</text>
    </g>

    <g transform="translate(30 104)">
      <rect width="302" height="574" rx="22" fill="#fbf8fa" stroke="#eee3e8"/>
      <text x="24" y="38" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" letter-spacing="1.8" fill="#9a6b7d">MEMORIA DOCUMENTAL</text>

      <g transform="translate(24 70)">
        <rect width="254" height="70" rx="16" fill="#fff" stroke="#eadde4"/>
        <text x="18" y="30" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="900" fill="#86123a">30 anos</text>
        <text x="18" y="52" font-family="Inter, Arial, sans-serif" font-size="13" fill="#806272">planes, acuerdos, mapas y actas</text>
      </g>

      <g transform="translate(24 166)">
        <text x="0" y="0" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="800" fill="#4a2434">Fuentes conectadas</text>
        <g transform="translate(0 20)">
          <rect width="254" height="44" rx="12" fill="#fff"/>
          <circle cx="22" cy="22" r="8" fill="#b01852"/>
          <text x="42" y="19" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#3d1324">Documentos historicos</text>
          <text x="42" y="34" font-family="Inter, Arial, sans-serif" font-size="10" fill="#947484">1996 a la fecha</text>
        </g>
        <g transform="translate(0 78)">
          <rect width="254" height="44" rx="12" fill="#fff"/>
          <circle cx="22" cy="22" r="8" fill="#d59a1a"/>
          <text x="42" y="19" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#3d1324">Cartografia y tramites</text>
          <text x="42" y="34" font-family="Inter, Arial, sans-serif" font-size="10" fill="#947484">capas y expedientes</text>
        </g>
        <g transform="translate(0 136)">
          <rect width="254" height="44" rx="12" fill="#fff"/>
          <circle cx="22" cy="22" r="8" fill="#3859d6"/>
          <text x="42" y="19" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#3d1324">Relaciones semanticas</text>
          <text x="42" y="34" font-family="Inter, Arial, sans-serif" font-size="10" fill="#947484">documento -> tema -> zona</text>
        </g>
      </g>

      <g transform="translate(24 425)">
        <rect width="254" height="118" rx="18" fill="#3d1324"/>
        <text x="20" y="34" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" fill="#fff">Respuesta con evidencia</text>
        <text x="20" y="60" font-family="Inter, Arial, sans-serif" font-size="11" fill="#ead4dd">citas, fecha, dependencia,</text>
        <text x="20" y="78" font-family="Inter, Arial, sans-serif" font-size="11" fill="#ead4dd">relacion territorial y contexto</text>
        <rect x="20" y="92" width="88" height="10" rx="5" fill="#b01852"/>
        <rect x="116" y="92" width="52" height="10" rx="5" fill="#7e5364"/>
      </g>
    </g>

    <g transform="translate(364 104)">
      <rect width="698" height="574" rx="22" fill="#fff" stroke="#eee3e8"/>
      <g transform="translate(28 28)">
        <text x="0" y="0" dominant-baseline="hanging" font-family="Inter, Arial, sans-serif" font-size="36" font-weight="900" fill="#3d1324">Consulta por voz</text>
        <text x="0" y="52" font-family="Inter, Arial, sans-serif" font-size="15" fill="#856272">Pregunta sobre normativa, planes urbanos o antecedentes historicos.</text>
      </g>

      <g transform="translate(36 122)">
        <rect width="626" height="74" rx="20" fill="#f7edf2"/>
        <circle cx="40" cy="37" r="22" fill="url(#wine)"/>
        <path d="M40 25v24M31 36c0 15 18 15 18 0" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/>
        <text x="78" y="33" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800" fill="#3d1324">"Que documentos sustentan el crecimiento urbano en la zona este?"</text>
        <text x="78" y="54" font-family="Inter, Arial, sans-serif" font-size="12" fill="#956b7d">voz transcrita automaticamente</text>
      </g>

      <g transform="translate(36 230)">
        <rect width="626" height="190" rx="22" fill="#fcfbfc" stroke="#eee3e8"/>
        <text x="24" y="34" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="900" fill="#86123a">Respuesta sintetizada</text>
        <text x="24" y="70" font-family="Inter, Arial, sans-serif" font-size="15" fill="#3d1324">El agente relaciona antecedentes de planeacion, acuerdos</text>
        <text x="24" y="96" font-family="Inter, Arial, sans-serif" font-size="15" fill="#3d1324">y documentos tecnicos para explicar cambios urbanos por zona.</text>
        <text x="24" y="136" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="800" fill="#8b6675">EVIDENCIA</text>
        <rect x="24" y="150" width="138" height="22" rx="11" fill="#f5e7ed"/>
        <text x="93" y="165" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#86123a">Plan 1996</text>
        <rect x="172" y="150" width="158" height="22" rx="11" fill="#f5e7ed"/>
        <text x="251" y="165" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#86123a">Actualizacion 2010</text>
        <rect x="340" y="150" width="190" height="22" rx="11" fill="#f5e7ed"/>
        <text x="435" y="165" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#86123a">Programa vigente</text>
      </g>

      <g transform="translate(36 454)">
        <text x="0" y="0" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="900" letter-spacing="1.6" fill="#9a6b7d">CONEXIONES</text>
        <path d="M70 58 C160 10 250 10 340 58 S520 106 602 58" fill="none" stroke="#b01852" stroke-width="3" opacity="0.7"/>
        <circle cx="70" cy="58" r="20" fill="#fff" stroke="#b01852" stroke-width="3"/>
        <circle cx="340" cy="58" r="20" fill="#fff" stroke="#b01852" stroke-width="3"/>
        <circle cx="602" cy="58" r="20" fill="#fff" stroke="#b01852" stroke-width="3"/>
        <text x="70" y="105" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" fill="#3d1324">Documento</text>
        <text x="340" y="105" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" fill="#3d1324">Tema urbano</text>
        <text x="602" y="105" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" fill="#3d1324">Zona</text>
      </g>
    </g>
  </g>
</svg>
