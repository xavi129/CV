<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="title desc" role="img" viewBox="0 0 1200 800"><title id="title">SMIG Agente Conversacional de Voz</title><desc id="desc">Interfaz conceptual del agente de voz con memoria documental y conexiones historicas.</desc><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#fff7fa"/><stop offset=".52" stop-color="#f7f1f5"/><stop offset="1" stop-color="#eceef7"/></linearGradient><linearGradient id="wine" x1="0" x2="1"><stop offset="0" stop-color="#7f1134"/><stop offset="1" stop-color="#b01852"/></linearGradient><filter id="shadow" width="140%" height="140%" x="-20%" y="-20%"><feDropShadow dx="0" dy="18" flood-color="#5b0c2a" flood-opacity=".14" stdDeviation="24"/></filter></defs><rect width="1200" height="800" fill="url(#bg)" rx="34"/><circle cx="1000" cy="120" r="210" fill="#ffd9e7" opacity=".4"/><circle cx="160" cy="690" r="220" fill="#e0e7ff" opacity=".55"/><g transform="translate(54 46)"><rect width="1092" height="708" fill="#fff" filter="url(#shadow)" rx="28"/><rect width="1092" height="74" fill="#fff" rx="28"/><path stroke="#eee5ea" d="M0 74h1092"/><g transform="translate(30 20)"><rect width="34" height="34" fill="url(#wine)" rx="9"/><path stroke="#fff" stroke-linecap="round" stroke-width="3" d="M18 9v16M10 17h16"/><text x="50" y="16" fill="#3d1324" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="800">SMIG Voice Agent</text><text x="50" y="36" fill="#8b6675" font-family="Inter, Arial, sans-serif" font-size="12">Sistema de Informacion Geografica de Tijuana</text></g><g transform="translate(862 22)"><rect width="88" height="30" fill="#f5e7ed" rx="15"/><text x="44" y="20" fill="#8c143b" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">1996-2026</text><rect width="98" height="30" x="102" fill="#ecfff5" rx="15"/><circle cx="120" cy="15" r="4" fill="#00a76f"/><text x="158" y="20" fill="#066342" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">LIVE</text></g><g transform="translate(30 104)"><rect width="302" height="574" fill="#fbf8fa" stroke="#eee3e8" rx="22"/><text x="24" y="38" fill="#9a6b7d" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" letter-spacing="1.8">MEMORIA DOCUMENTAL</text><g transform="translate(24 70)"><rect width="254" height="70" fill="#fff" stroke="#eadde4" rx="16"/><text x="18" y="30" fill="#86123a" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="900">30 anos</text><text x="18" y="52" fill="#806272" font-family="Inter, Arial, sans-serif" font-size="13">planes, acuerdos, mapas y actas</text></g><g><text x="0" y="0" fill="#4a2434" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="800" transform="translate(24 166)">Fuentes conectadas</text><g transform="translate(24 166) translate(0 20)"><rect width="254" height="44" fill="#fff" rx="12"/><circle cx="22" cy="22" r="8" fill="#b01852"/><text x="42" y="19" fill="#3d1324" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700">Documentos historicos</text><text x="42" y="34" fill="#947484" font-family="Inter, Arial, sans-serif" font-size="10">1996 a la fecha</text></g><g transform="translate(24 166) translate(0 78)"><rect width="254" height="44" fill="#fff" rx="12"/><circle cx="22" cy="22" r="8" fill="#d59a1a"/><text x="42" y="19" fill="#3d1324" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700">Cartografia y tramites</text><text x="42" y="34" fill="#947484" font-family="Inter, Arial, sans-serif" font-size="10">capas y expedientes</text></g><g transform="translate(24 166) translate(0 136)"><rect width="254" height="44" fill="#fff" rx="12"/><circle cx="22" cy="22" r="8" fill="#3859d6"/><text x="42" y="19" fill="#3d1324" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700">Relaciones semanticas</text><text x="42" y="34" fill="#947484" font-family="Inter, Arial, sans-serif" font-size="10">documento -&gt; tema -&gt; zona</text></g></g><g transform="translate(24 425)"><rect width="254" height="118" fill="#3d1324" rx="18"/><text x="20" y="34" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800">Respuesta con evidencia</text><text x="20" y="60" fill="#ead4dd" font-family="Inter, Arial, sans-serif" font-size="11">citas, fecha, dependencia,</text><text x="20" y="78" fill="#ead4dd" font-family="Inter, Arial, sans-serif" font-size="11">relacion territorial y contexto</text><rect width="88" height="10" x="20" y="92" fill="#b01852" rx="5"/><rect width="52" height="10" x="116" y="92" fill="#7e5364" rx="5"/></g></g><g transform="translate(364 104)"><rect width="698" height="574" fill="#fff" stroke="#eee3e8" rx="22"/><g><text x="0" y="0" fill="#3d1324" dominant-baseline="hanging" font-family="Inter, Arial, sans-serif" font-size="36" font-weight="900" transform="translate(28 28)">Consulta por voz</text><text x="0" y="52" fill="#856272" font-family="Inter, Arial, sans-serif" font-size="15" transform="translate(28 28)">Pregunta sobre normativa, planes urbanos o antecedentes historicos.</text></g><g transform="translate(36 122)"><rect width="626" height="74" fill="#f7edf2" rx="20"/><circle cx="40" cy="37" r="22" fill="url(#wine)"/><path fill="none" stroke="#fff" stroke-linecap="round" stroke-width="3" d="M40 25v24M31 36c0 15 18 15 18 0"/><text x="78" y="33" fill="#3d1324" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800">&quot;Que documentos sustentan el crecimiento urbano en la zona este?&quot;</text><text x="78" y="54" fill="#956b7d" font-family="Inter, Arial, sans-serif" font-size="12">voz transcrita automaticamente</text></g><g transform="translate(36 230)"><rect width="626" height="190" fill="#fcfbfc" stroke="#eee3e8" rx="22"/><text x="24" y="34" fill="#86123a" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="900">Respuesta sintetizada</text><text x="24" y="70" fill="#3d1324" font-family="Inter, Arial, sans-serif" font-size="15">El agente relaciona antecedentes de planeacion, acuerdos</text><text x="24" y="96" fill="#3d1324" font-family="Inter, Arial, sans-serif" font-size="15">y documentos tecnicos para explicar cambios urbanos por zona.</text><text x="24" y="136" fill="#8b6675" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="800">EVIDENCIA</text><rect width="138" height="22" x="24" y="150" fill="#f5e7ed" rx="11"/><text x="93" y="165" fill="#86123a" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Plan 1996</text><rect width="158" height="22" x="172" y="150" fill="#f5e7ed" rx="11"/><text x="251" y="165" fill="#86123a" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Actualizacion 2010</text><rect width="190" height="22" x="340" y="150" fill="#f5e7ed" rx="11"/><text x="435" y="165" fill="#86123a" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Programa vigente</text></g><g transform="translate(36 454)"><text x="0" y="0" fill="#9a6b7d" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="900" letter-spacing="1.6">CONEXIONES</text><path fill="none" stroke="#b01852" stroke-width="3" d="M70 58 C160 10 250 10 340 58 S520 106 602 58" opacity=".7"/><circle cx="70" cy="58" r="20" fill="#fff" stroke="#b01852" stroke-width="3"/><circle cx="340" cy="58" r="20" fill="#fff" stroke="#b01852" stroke-width="3"/><circle cx="602" cy="58" r="20" fill="#fff" stroke="#b01852" stroke-width="3"/><text x="70" y="105" fill="#3d1324" font-family="Inter, Arial, sans-serif" font-size="11" text-anchor="middle">Documento</text><text x="340" y="105" fill="#3d1324" font-family="Inter, Arial, sans-serif" font-size="11" text-anchor="middle">Tema urbano</text><text x="602" y="105" fill="#3d1324" font-family="Inter, Arial, sans-serif" font-size="11" text-anchor="middle">Zona</text></g></g></g></svg>